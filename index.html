<!DOCTYPE html> 

<html lang="es"> 

<head> 

    <meta charset="UTF-8"> 

    <title>Auditoría Textil - Mermas</title> 

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 

</head> 

<body class="bg-light p-4"> 

    <div class="container"> 

        <h2 class="text-dark border-bottom pb-2">✂️ Control de Calidad: Mermas de Corte</h2> 

        <div class="row mt-4"> 

            <div class="col-md-4"> 

                <div class="card p-3 border-dark shadow-sm"> 

                    <input type="text" id="idRollo" class="form-control mb-2" placeholder="ID del Rollo"> 

                    <input type="number" id="mtsTotales" class="form-control mb-2" placeholder="Metros Totales"> 

                    <input type="number" id="mtsDefecto" class="form-control mb-3" placeholder="Metros con Defecto"> 

                    <button id="btnAuditar" class="btn btn-dark w-100">Guardar Auditoría</button> 

                </div> 

            </div> 

            <div class="col-md-8"> 

                <table class="table table-bordered bg-white"> 

                    <thead> 

                        <tr class="table-secondary"> 

                            <th>Rollo</th> 

                            <th>Mts Totales</th> 

                            <th>% Merma</th> 

                            <th>Estado de Calidad</th> 

                        </tr> 

                    </thead> 

                    <tbody id="tablaMermas"> 

                        <!-- Registros desde JS --> 

                    </tbody> 

                </table> 

            </div> 

        </div> 

    </div> 

    <script src="js/app.js"></script> 

</body> 

</html>
